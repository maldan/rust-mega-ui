[package]
name = "mega-ui"
version = "0.1.0"
edition = "2024"
autoexamples = false

[features]
default = []
## wgpu pipeline helpers (`mega_ui::wgpu::UiRenderer` + bundled UI shader).
wgpu = ["dep:wgpu", "dep:bytemuck", "dep:windows"]

[dependencies]
glam = "0.33.2"
fontdue = "0.9.4"
resvg = { version = "0.47", default-features = false }
wgpu = { version = "30", optional = true }
bytemuck = { version = "1.22", optional = true, features = ["derive"] }

[dev-dependencies]
arboard = "3"
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
winit = "0.30"

# Force gpu-allocator onto the same `windows` major as wgpu-hal (0.62).
# Without this, cargo can resolve gpu-allocator onto windows 0.58 and the
# D3D12 types no longer match (ID3D12Device / D3D12_RESOURCE_DESC mismatch).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true }

[[example]]
name = "demo"
path = "examples/demo.rs"
required-features = ["wgpu"]

[[example]]
name = "demo_dock"
path = "examples/demo_dock.rs"
required-features = ["wgpu"]

[[example]]
name = "demo_nodes"
path = "examples/demo_nodes.rs"
required-features = ["wgpu"]
